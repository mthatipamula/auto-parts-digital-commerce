spring:
  application.name: checkout-service
  threads.virtual.enabled: true
  data.redis:
    host: ${VALKEY_HOST:localhost}
    port: ${VALKEY_PORT:6379}
    timeout: 1s
  cloud.gcp:
    project-id: ${GCP_PROJECT:auto-parts-local}
    spanner:
      instance-id: ${SPANNER_INSTANCE:commerce}
      database: ${SPANNER_DATABASE:checkout}
      emulator.enabled: ${SPANNER_EMULATOR:true}
      emulator-host: ${SPANNER_EMULATOR_HOST:localhost:9010}
    pubsub:
      emulator-host: ${PUBSUB_EMULATOR_HOST:localhost:8085}
      publisher.enable-message-ordering: true
server:
  port: ${PORT:8083}
  shutdown: graceful

platform:
  services:
    catalog: ${CATALOG_URL:http://localhost:8081}
    inventory: ${INVENTORY_URL:http://localhost:8082}
    payment: ${PAYMENT_URL:http://localhost:8084}
  security:
    issuer: ${OIDC_ISSUER:http://localhost:8180/realms/auto-parts}
    jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8180/realms/auto-parts/protocol/openid-connect/certs}

# Resilience4j: per-dependency policies. Business failures (4xx) are ignored by retry and circuit breakers.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50           # open when half the recent calls fail
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80         # ...or when most are slow
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions: [com.autoparts.checkout.Downstream$Transient]
        ignore-exceptions: [com.autoparts.checkout.Downstream$Business]
    instances:
      catalog: { base-config: default }
      inventory: { base-config: default }
      payment: { base-config: default, slow-call-duration-threshold: 3s }
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true         # jitter, so retries from many pods don't synchronize
        retry-exceptions: [com.autoparts.checkout.Downstream$Transient]
        ignore-exceptions: [com.autoparts.checkout.Downstream$Business, io.github.resilience4j.circuitbreaker.CallNotPermittedException]
    instances:
      catalog: { base-config: default }
      inventory: { base-config: default }
      payment: { base-config: default }
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 25
        max-wait-duration: 100ms
    instances:
      catalog: { base-config: default }
      inventory: { base-config: default }
      payment: { base-config: default, max-concurrent-calls: 10 }

management:
  endpoints.web.exposure.include: health,info,prometheus,circuitbreakers
  endpoint.health.probes.enabled: true
  health.circuitbreakers.enabled: true
  tracing.sampling.probability: 1.0
  opentelemetry.tracing.export.otlp.endpoint: ${OTLP_TRACES:http://localhost:4318/v1/traces}
  otlp.metrics.export.url: ${OTLP_METRICS:http://localhost:4318/v1/metrics}
