server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # Re-resolve the gateway's address (Docker / Kubernetes DNS) instead of caching the IP from startup:
  # a redeployed gateway gets a new IP, and a cached one turns every request into a 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway http://gateway:8080;
  location /api/ { proxy_pass $gateway; proxy_read_timeout 60s; }
  location = /config.js { add_header Cache-Control "no-store"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; }
}
