# Grafana + Tempo + Mimir + Loki in one pod, as `otel-collector.observability` (the OTLP address in the Helm values).
# A production cluster would use Google Cloud Observability or a managed Grafana stack instead.
apiVersion: v1
kind: Namespace
metadata: { name: observability }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: observability, labels: { app.kubernetes.io/name: otel-collector } }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: otel-collector } }
  template:
    metadata: { labels: { app.kubernetes.io/name: otel-collector } }
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.11.10
          ports: [{ name: otlp-http, containerPort: 4318 }, { name: grafana, containerPort: 3000 }]
          resources: { requests: { cpu: 500m, memory: 2Gi }, limits: { memory: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: observability }
spec:
  selector: { app.kubernetes.io/name: otel-collector }
  ports: [{ name: otlp-http, port: 4318, targetPort: otlp-http }, { name: grafana, port: 3000, targetPort: grafana }]
