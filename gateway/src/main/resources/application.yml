spring:
  application.name: gateway
  data.redis:
    host: ${VALKEY_HOST:localhost}
    port: ${VALKEY_PORT:6379}
  cloud.gateway.server.webflux:
    default-filters:
      - name: RequestRateLimiter            # token bucket per user / IP, stored in Valkey
        args:
          key-resolver: "#{@userOrIp}"
          redis-rate-limiter.replenishRate: 20
          redis-rate-limiter.burstCapacity: 40
          redis-rate-limiter.requestedTokens: 1
      - DedupeResponseHeader=Access-Control-Allow-Origin
    routes:
      - id: catalog
        uri: ${CATALOG_URL:http://localhost:8081}
        predicates: [Path=/api/catalog/**]
        filters:
          - name: CircuitBreaker
            args: { name: catalog, fallbackUri: "forward:/fallback/catalog" }
          - name: Retry                     # reads only
            args: { retries: 2, methods: GET, statuses: "BAD_GATEWAY,SERVICE_UNAVAILABLE", backoff: { firstBackoff: 50ms, maxBackoff: 500ms } }
      - id: inventory-public
        uri: ${INVENTORY_URL:http://localhost:8082}
        predicates: ["Path=/api/inventory/stores,/api/inventory/availability"]
      - id: checkout
        uri: ${CHECKOUT_URL:http://localhost:8083}
        predicates: ["Path=/api/cart/**,/api/orders/**,/api/orders,/api/cart,/api/checkout/**"]
      - id: payment-admin                   # only the fault-injection switch; authorizations stay internal
        uri: ${PAYMENT_URL:http://localhost:8084}
        predicates: [Path=/api/payments/chaos]
    httpclient:
      connect-timeout: 2000
      response-timeout: 30s
server:
  port: ${PORT:8080}
  shutdown: graceful
platform:
  security:
    issuer: ${OIDC_ISSUER:http://localhost:8180/realms/auto-parts}
    jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8180/realms/auto-parts/protocol/openid-connect/certs}
resilience4j:
  circuitbreaker.instances.catalog:
    sliding-window-size: 20
    minimum-number-of-calls: 10
    failure-rate-threshold: 50
    wait-duration-in-open-state: 10s
  timelimiter.instances.catalog.timeout-duration: 3s
management:
  endpoints.web.exposure.include: health,info,prometheus,gateway
  endpoint.health.probes.enabled: true
  tracing.sampling.probability: 1.0
  opentelemetry.tracing.export.otlp.endpoint: ${OTLP_TRACES:http://localhost:4318/v1/traces}
  otlp.metrics.export.url: ${OTLP_METRICS:http://localhost:4318/v1/metrics}
